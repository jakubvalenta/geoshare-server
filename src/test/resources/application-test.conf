ktor {
    deployment {
        host =  "127.0.0.1"
        port = 8080
    }
    application {
        dependencies = [
            net.geoshare_app.testing.FakeCacheKt.provideFakeCache,
            net.geoshare_app.testing.FakeGoogleMapsClientKt.provideFakeGoogleMapsClient,
            net.geoshare_app.testing.TestVerifierKt.provideVerifier,
        ]
        modules = [
            net.geoshare_app.ApplicationKt.rootModule,
            net.geoshare_app.AuthenticationKt.authenticationModule,
            net.geoshare_app.GoogleMapsKt.googleMapsModule,
        ]
    }
}

auth {
    challenge {
        expireSec = 2
    }
    device {
        expireSec = 2
    }
    jwt {
        expireSec = 2
        secret = "test-secret"
    }
}

cache {
    uri = ""
}

googleMaps {
    apiKey = ""
}
