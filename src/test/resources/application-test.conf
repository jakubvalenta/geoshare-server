ktor {
    deployment {
        host =  "127.0.0.1"
        port = 8080
    }
    application {
        dependencies = [
            net.geoshare_app.FakeCacheKt.provideFakeCache,
            net.geoshare_app.FakeGoogleMapsClientKt.provideFakeGoogleMapsClient,
        ]
        modules = [
            net.geoshare_app.ApplicationKt.rootModule,
            net.geoshare_app.AuthenticationKt.authenticationModule,
            net.geoshare_app.GoogleMapsKt.googleMapsModule,
        ]
    }
}

cache {
    uri = ""
}

database {
    url = "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    driver = "org.h2.Driver"
}

googleMaps {
    apiKey = ""
}
