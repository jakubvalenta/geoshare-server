ktor {
    deployment {
        host =  "127.0.0.1"
        port = 8080
    }
}

auth {
    challengeExpireSec = 2
    deviceExpireSec = 6
    jwtExpireSec = 4
    jwtSecret = "test-secret"
    revocationListRefreshIntervalSec = 30
    statusApiTokenHash = ""
}

cache {
    uri = ""
}

googleMaps {
    apiKey = "test-api-key"
}

rateLimit {
    default = {
        limit = 10
        refillPeriodSec = 60
    }
    register = {
        limit = 5
        refillPeriodSec = 3600
    }
    unverified = {
        limit = 1
        refillPeriodSec = 60
    }
    verified = {
        limit = 5
        refillPeriodSec = 60
    }
}
