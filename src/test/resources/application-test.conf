ktor {
    deployment {
        host =  "127.0.0.1"
        port = 8080
    }
    application {
        modules = [
            net.geoshare_app.DatabaseKt.configureDatabase,
            net.geoshare_app.ApplicationKt.rootModule,
            net.geoshare_app.GoogleMapsKt.googleMapsModule,
        ]
    }
}

database {
    url = "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    driver = "org.h2.Driver"
}
