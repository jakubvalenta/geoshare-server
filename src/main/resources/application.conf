ktor {
    deployment {
        host =  "127.0.0.1"
        port = 8080
    }
    application {
        dependencies = [
            net.geoshare_app.CacheKt.provideCache,
            net.geoshare_app.CertificateVerificationKt.provideCertificateVerification,
            net.geoshare_app.HttpClientEngineKt.provideHttpClientEngine,
            net.geoshare_app.StatsRepositoryKt.provideStatsRepository,
        ]
        modules = [
            net.geoshare_app.ApplicationKt.rootModule,
        ]
    }
}

auth {
    challengeExpireSec = 120
    deviceExpireSec = 7776000
    jwtExpireSec = 86400
    jwtSecretFile = ${JWT_SECRET_FILE}
    revocationListRefreshIntervalSec = 86400
    statusApiTokenHashFile = ${STATUS_API_TOKEN_HASH_FILE}
}

cache {
    uri = ${CACHE_URI}
}

googleMaps {
    apiKeyFile = ${GOOGLE_MAPS_API_KEY_FILE}
    dryRun = ${?DRY_RUN}
}

rateLimit {
    default = {
        limit = 10
        limit = ${?RATE_LIMIT_DEFAULT}
        refillPeriodSec = 60
    }
    register = {
        limit = 5
        limit = ${?RATE_LIMIT_REGISTER}
        refillPeriodSec = 3600
    }
    unverified = {
        limit = 1
        limit = ${?RATE_LIMIT_UNVERIFIED}
        refillPeriodSec = 60
    }
    verified = {
        limit = 5
        limit = ${?RATE_LIMIT_VERIFIED}
        refillPeriodSec = 60
    }
}
