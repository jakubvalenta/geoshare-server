ktor {
    deployment {
        host =  "127.0.0.1"
        port = 8080
    }
    application {
        dependencies = [
            net.geoshare_app.CacheKt.provideCache,
        ]
        modules = [
            net.geoshare_app.DatabaseKt.configureDatabase,
            net.geoshare_app.ApplicationKt.rootModule,
            net.geoshare_app.GoogleMapsKt.googleMapsModule,
        ]
    }
}

cache {
    uri = ${CACHE_URI}
}

database {
    url = ${DATABASE_URL}
    driver = "org.postgresql.Driver"
    user = ${DATABASE_USER}
    password = ${DATABASE_PASSWORD}
}

googleMaps {
    apiKey = ${GOOGLE_MAPS_API_KEY}
}
